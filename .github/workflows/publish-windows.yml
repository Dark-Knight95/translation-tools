name: Publish Windows 2.0.2

on:
  push:
    branches: [main]
    paths: [".github/windows-parts/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-2.0.2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify package and publish download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import base64
          import hashlib
          import io
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          root = "https://api.github.com/repos/" + os.environ["GH_REPO"]
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(path, data=None, method=None):
              body = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request(
                  root + path, data=body, method=method,
                  headers={**headers, "Content-Type": "application/json"})
              with urllib.request.urlopen(request, timeout=180) as response:
                  return json.load(response)

          parts = [
              ("001", "b14d63cd80fdf4001b80b732aa461d3b6c733a61"),
              ("002", "9fc996884bb719729b9755a7636d5073531f5b50"),
          ]
          chunks = []
          for _, sha in parts:
              blob = api("/git/blobs/" + sha)
              chunk = base64.b64decode(blob["content"])
              actual = hashlib.sha1(b"blob " + str(len(chunk)).encode() + b"\0" + chunk).hexdigest()
              if actual != sha:
                  raise RuntimeError("Package transfer checksum failed")
              chunks.append(chunk)
          package = b"".join(chunks)
          digest = "14f8069859893bf05a3100c2d7d6aad23ef13ddf77f5500e197730a84d060beb"
          if len(package) != 17120612 or hashlib.sha256(package).hexdigest() != digest:
              raise RuntimeError("Windows ZIP does not match the tested release")
          with zipfile.ZipFile(io.BytesIO(package)) as archive:
              if archive.testzip() is not None:
                  raise RuntimeError("Windows ZIP is corrupt")
              executable = archive.read("TranslationTools.exe")
              if hashlib.sha256(executable).hexdigest() != "9ca0288b69181088a34ea3f4dbc8758b8d11afe84c1c872c8fcd4970a2b3ad87":
                  raise RuntimeError("Executable does not match the tested build")

          package_blob = api("/git/blobs", {
              "content": base64.b64encode(package).decode(), "encoding": "base64"})
          if package_blob["sha"] != "491a2f837eb2912748e9df856a5d8c2c3790f07a":
              raise RuntimeError("Uploaded package checksum failed")
          head = api("/git/ref/heads/main")["object"]["sha"]
          base = api("/git/commits/" + head)["tree"]["sha"]
          existing = {item["path"]: item["sha"] for item in api("/git/trees/" + base + "?recursive=1")["tree"]}
          destination = "downloads/TranslationTools_Windows.zip"
          if destination in existing and existing[destination] != package_blob["sha"]:
              raise RuntimeError("Refusing to replace a different Windows package")
          entries = [{"path": destination, "mode": "100644", "type": "blob", "sha": package_blob["sha"]}]
          for number, _ in parts:
              path = ".github/windows-parts/" + number
              if path in existing:
                  entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})
          if destination not in existing or len(entries) > 1:
              tree = api("/git/trees", {"base_tree": base, "tree": entries})
              commit = api("/git/commits", {
                  "message": "Add verified Windows download",
                  "tree": tree["sha"], "parents": [head]})
              api("/git/refs/heads/main", {"sha": commit["sha"], "force": False}, "PATCH")
              head = commit["sha"]

          try:
              release = api("/releases/tags/v2.0.2")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              release = api("/releases", {
                  "tag_name": "v2.0.2", "target_commitish": head,
                  "name": "Translation Tools 2.0.2",
                  "body": "Copy and rename files, and shift subtitle timestamps.\n\nExtract the Windows ZIP and run TranslationTools.exe. No Python installation required.",
                  "draft": False, "prerelease": False})
          assets = {item["name"]: item for item in release["assets"]}
          uploads = [
              ("TranslationTools_Windows.zip", package, "application/zip"),
              ("SHA256SUMS.txt", (digest + "  TranslationTools_Windows.zip\n").encode(), "text/plain"),
          ]
          for name, content, mime in uploads:
              if name in assets:
                  if assets[name].get("digest") != "sha256:" + hashlib.sha256(content).hexdigest():
                      raise RuntimeError("A different release asset already exists: " + name)
                  continue
              url = release["upload_url"].split("{", 1)[0] + "?" + urllib.parse.urlencode({"name": name})
              request = urllib.request.Request(
                  url, data=content, method="POST",
                  headers={**headers, "Content-Type": mime})
              with urllib.request.urlopen(request, timeout=180) as response:
                  asset = json.load(response)
              if asset["size"] != len(content):
                  raise RuntimeError("Release asset size check failed")
              if asset.get("digest") and asset["digest"] != "sha256:" + hashlib.sha256(content).hexdigest():
                  raise RuntimeError("Release asset checksum failed")
          print(json.dumps({"release": release["html_url"], "commit": head, "sha256": digest}))

